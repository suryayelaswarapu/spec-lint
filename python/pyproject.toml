[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spec-lint"
dynamic = ["version"]
description = "Modernize legacy API contracts: convert Swagger 2.0 and WSDL 1.1 to OpenAPI 3.1, auto-fix, and lint against a standardized ruleset."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Surya Yelaswarapu" }]
keywords = ["openapi", "swagger", "wsdl", "soap", "lint", "api-design", "converter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Code Generators",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1,<9",
  "PyYAML>=6.0.1,<7",
  "defusedxml>=0.7.1,<1",
  "jsonschema>=4.18,<5",
  "referencing>=0.30",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]
dev = [
  "spec-lint[server]",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "types-defusedxml",
  "types-jsonschema",
  "pre-commit>=3.7",
]

[project.scripts]
speclint = "speclint.cli:main"

[project.urls]
Homepage = "https://github.com/suryayelaswarapu/spec-lint"
Issues = "https://github.com/suryayelaswarapu/spec-lint/issues"
Changelog = "https://github.com/suryayelaswarapu/spec-lint/blob/main/CHANGELOG.md"
Source = "https://github.com/suryayelaswarapu/spec-lint/tree/main/python"

[tool.hatch.version]
path = "src/speclint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/speclint"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "RET"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT012", "PT018", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["speclint"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
