openapi: 3.1.0
info:
  title: LegacyForecastService
  version: 1.0.0
  description: Generated by spec-lint from a WSDL 1.1 contract (JSON facade over SOAP).
servers:
  - url: /
    description: REST facade (deploy behind an API gateway that calls the SOAP backend)
    x-soap-addresses:
      - http://legacy.example.com/forecast/server.php
tags:
  - name: LegacyForecastService
    description: Legacy point and daily forecast service.
paths:
  /get-forecast-by-point:
    post:
      tags:
        - LegacyForecastService
      summary: GetForecastByPoint
      operationId: getForecastByPoint
      description: Returns a forecast document (as an XML string) for one point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetForecastByPointRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetForecastByPointResponse'
        '500':
          description: SOAP Fault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoapFault'
      x-soap:
        operation: GetForecastByPoint
        style: rpc
        soapAction: urn:example:legacy-forecast#GetForecastByPoint
        binding: LegacyForecastBinding
        soapVersion: '1.1'
        service: LegacyForecastService
        port: LegacyForecastPort
  /get-forecast-by-day:
    post:
      tags:
        - LegacyForecastService
      summary: GetForecastByDay
      operationId: getForecastByDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetForecastByDayRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetForecastByDayResponse'
        '500':
          description: SOAP Fault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoapFault'
      x-soap:
        operation: GetForecastByDay
        style: rpc
        soapAction: urn:example:legacy-forecast#GetForecastByDay
        binding: LegacyForecastBinding
        soapVersion: '1.1'
        service: LegacyForecastService
        port: LegacyForecastPort
  /list-stations:
    post:
      tags:
        - LegacyForecastService
      summary: ListStations
      operationId: listStations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListStationsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStationsResponse'
        '500':
          description: SOAP Fault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoapFault'
      x-soap:
        operation: ListStations
        style: rpc
        soapAction: urn:example:legacy-forecast#ListStations
        binding: LegacyForecastBinding
        soapVersion: '1.1'
        service: LegacyForecastService
        port: LegacyForecastPort
components:
  schemas:
    ProductType:
      type: string
      enum:
        - time-series
        - glance
    WeatherParametersType:
      type: object
      properties:
        maxt:
          type: boolean
        mint:
          type: boolean
        temp:
          type: boolean
        pop12:
          type: boolean
        wspd:
          type: boolean
      required:
        - maxt
        - mint
        - temp
        - pop12
        - wspd
    GetForecastByPointRequest:
      type: object
      required:
        - latitude
        - longitude
        - product
        - startTime
        - endTime
        - weatherParameters
      properties:
        latitude:
          type: number
        longitude:
          type: number
        product:
          $ref: '#/components/schemas/ProductType'
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        weatherParameters:
          $ref: '#/components/schemas/WeatherParametersType'
    GetForecastByPointResponse:
      type: object
      required:
        - dwmlOut
      properties:
        dwmlOut:
          type: string
    FormatType:
      type: string
      enum:
        - 24 hourly
        - 12 hourly
    GetForecastByDayRequest:
      type: object
      required:
        - latitude
        - longitude
        - startDate
        - numDays
        - format
      properties:
        latitude:
          type: number
        longitude:
          type: number
        startDate:
          type: string
          format: date
        numDays:
          type: integer
        format:
          $ref: '#/components/schemas/FormatType'
    GetForecastByDayResponse:
      type: object
      required:
        - dwmlByDayOut
      properties:
        dwmlByDayOut:
          type: string
    ListStationsRequest:
      type: object
      required:
        - stateCode
      properties:
        stateCode:
          type: string
    ArrayOfString:
      type: array
      items:
        type: string
    ListStationsResponse:
      type: object
      required:
        - stations
      properties:
        stations:
          $ref: '#/components/schemas/ArrayOfString'
    SoapFault:
      type: object
      description: SOAP Fault translated to JSON.
      required:
        - faultcode
        - faultstring
      properties:
        faultcode:
          type: string
          examples:
            - soap:Server
        faultstring:
          type: string
        faultactor:
          type: string
        detail:
          description: Application-specific fault detail.
