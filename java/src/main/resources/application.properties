# spec-lint web service (Spring Boot). Every value can be overridden with an environment variable.
spring.application.name=speclint
spring.main.banner-mode=off
server.address=${SPECLINT_HOST:127.0.0.1}
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.max-swallow-size=2MB
spring.jackson.default-property-inclusion=always

# Request body limit in bytes and optional bearer token for /api/v1 POST endpoints.
speclint.max-bytes=${SPECLINT_MAX_BYTES:2097152}
speclint.api-token=${SPECLINT_API_TOKEN:}
server.mime-mappings.yaml=application/yaml
