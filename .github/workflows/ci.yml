name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: gradlew check (Java + Python + Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod, cache-dependency-path: go/go.sum}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, test and enforce coverage (>= 80%)
        run: ./gradlew check --console=plain
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            java/build/reports/jacoco/test/
            python/build/coverage.xml
            go/build/coverage.out

  python-versions:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.13']
    defaults:
      run: {working-directory: python}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -e '.[dev]'
      - run: pytest -q

  go-os:
    name: Go on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false  # report every OS, instead of cancelling the rest after the first failure
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run: {working-directory: go, shell: bash}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod, cache-dependency-path: go/go.sum}
      - name: go test
        run: |
          set -o pipefail
          go test -count=1 -timeout 5m ./... 2>&1 | tee go-test.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E -- '--- FAIL|panic:|_test\.go:[0-9]+:|^FAIL|timed out' go-test.log | head -30 |
            while IFS= read -r line; do echo "::error title=go test (${{ runner.os }})::${line}"; done

  dogfood:
    name: Modernize the weather examples
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod, cache-dependency-path: go/go.sum}
      - name: Build CLI
        working-directory: go
        run: go build -o ../speclint ./cmd/speclint
      - name: Modernize every weather contract
        run: |
          mkdir -p out
          for f in testdata/weather/*; do
            name=$(basename "$f"); name="${name%.*}"
            ./speclint modernize "$f" -o "out/$name.openapi.yaml" \
              --report "out/$name.report.md" --sarif "out/$name.sarif" --fail-on error
          done
      - uses: actions/upload-artifact@v4
        with: {name: modernized-examples, path: out/}

  docker:
    name: Docker images (all three servers)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start and smoke-test every server
        run: |
          docker compose up -d
          for port in 8081 8082 8083; do
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$port/health" && break; sleep 2; done
            curl -fsS -X POST "http://127.0.0.1:$port/api/v1/lint" -H 'Content-Type: application/json' \
              -d '{"spec": "openapi: 3.1.0\ninfo: {title: x, version: 1.0.0}\npaths: {}"}'
          done
      - if: always()
        run: docker compose logs && docker compose down

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
